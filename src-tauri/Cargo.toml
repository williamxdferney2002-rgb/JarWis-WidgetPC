[package]
name = "jarwis-app"
version = "0.1.0"
description = "JarWis: barra flotante para Windows 11"
edition = "2021"
publish = false

[[bin]]
name = "jarwis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Monitoreo (JW-3-01): solo CPU/memoria, discos y redes.
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
# Accesos rápidos (JW-3-03): solo desde Rust; la WebView no tiene permisos del opener.
tauri-plugin-opener = "2.7.2"
# Fase 4 (JW-4-02): OAuth de Google y consultas de solo lectura. Crate del propio
# workspace; reutiliza el tokio de Tauri y trae reqwest + rustls (vía oauth2).
jarwis-auth = { path = "../crates/jarwis-auth" }

# Oyente del portapapeles (D-028). Misma versión que ya arrastra Tauri (sin
# crates nuevos). JW-3-02 añade features: audio (Media_Audio*, Com_*,
# FunctionDiscovery, PropertiesSystem, Variant) y multimedia (Media_Control).
# JW-2-09: Input_KeyboardAndMouse (GetAsyncKeyState, fin del arrastre de la isla).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Media_Control",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
