[package]
name = "jarwis-auth"
version = "0.1.0"
edition = "2024"
publish = false
description = "OAuth 2.0 (Google y Microsoft) y almacenamiento seguro de tokens para JarWis"

[[bin]]
name = "jarwis-auth-cli"
path = "src/bin/jarwis-auth-cli.rs"

[dependencies]
# Flujo OAuth 2.0 (PKCE, canje, refresh, revocación); trae reqwest 0.12 + rustls, que se reutiliza vía oauth2::reqwest.
oauth2 = "5.0.0"
# API de credenciales y backend del Administrador de credenciales de Windows (keyring 4 dividido).
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
# Lectura de la configuración y de las respuestas JSON de las APIs.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Runtime async (current_thread) y spawn_blocking para el servidor loopback.
tokio = { version = "1.53.3", features = ["rt", "macros"] }
